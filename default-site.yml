---
site:
  title: OpenShift AI 3.5
  url: https://pkstaz.github.io/rhoai-showroom
  start_page: modules::00-00-intro.adoc

content:
  sources:
  - url: .
    start_path: content

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/v0.0.1/ui-bundle.zip
    snapshot: true
  supplemental_files: ./content/supplemental-ui

runtime:
  cache_dir: ./.cache/antora

antora:
  extensions:
  - require: ./content/lib/dev-mode.js
    enabled: false
  - require: ./content/lib/landing-page.js
    enabled: true

output:
  dir: ./www
