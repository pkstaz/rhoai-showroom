# Provider profile de MaaS para OpenShell (modulo 23). OpenShell no lo carga;
# renderiza el host antes de importar:
#
#   CLUSTER_DOMAIN=$(oc get ingresses.config/cluster -o jsonpath='{.spec.domain}')
#   sed "s|__CLUSTER_DOMAIN__|${CLUSTER_DOMAIN}|" \
#     manifests/openshell/maas-provider-profile.yaml > /tmp/maas-profile.yaml
#   openshell profile lint   -f /tmp/maas-profile.yaml
#   openshell profile import -f /tmp/maas-profile.yaml
#
# Binaries: OpenCode (/usr/local/bin/opencode, como en ghcr.io/anomalyco/opencode)
# y curl (/usr/bin/curl) para el smoke test. Ajusta a los paths de TU imagen.
# Credential scope: MAAS_API_KEY (sk-oai-... del modulo 10) como bearer a
# maas.<domain> y a nada mas.
id: maas
display_name: MaaS (cluster)
description: RHOAI MaaS (llm-d) del propio cluster
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: MaaS API key (sk-oai-...)
    env_vars: [MAAS_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: maas.__CLUSTER_DOMAIN__
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/local/bin/opencode, /usr/bin/curl]
