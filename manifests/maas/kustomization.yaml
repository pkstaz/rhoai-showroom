apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Bundle GitOps de la parte estatica de MaaS (modulo 4):
# GatewayClass, instancia Kuadrant y Postgres + maas-db-config.
# El Gateway y el patch del DSC los maneja manifests/apply-maas.sh porque
# dependen de valores del cluster (dominio, certificado, nombre del DSC).
resources:
  - kuadrant-namespace.yaml
  - gatewayclass.yaml
  - kuadrant.yaml
  - maas-postgres.yaml
