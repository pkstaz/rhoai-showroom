# Optional: NeMo as OpenAI-compatible proxy in front of MaaS Qwen.
# apply-guardrails.sh MODE=maas fills base_url + OPENAI_API_KEY.
# base_url (not openai_api_base): the 0.21 LangChain name fails the migration check.
# Placeholders below are replaced by the script; do not apply this file raw.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nemo-workshop-maas
  namespace: llm
data:
  config.yaml: |
    models:
      - type: main
        engine: openai
        parameters:
          base_url: "MAAS_V1_URL"
          model_name: "MODEL_ID"
    rails:
      config:
        sensitive_data_detection:
          input:
            entities:
              - EMAIL_ADDRESS
              - PERSON
              - PHONE_NUMBER
          output:
            entities:
              - PERSON
        regex_detection:
          input:
            patterns:
              - '\b(password|secret|api[_-]?key|token)\b'
            case_insensitive: true
      input:
        flows:
          - detect sensitive data on input
          - regex check input
      output:
        flows:
          - detect sensitive data on output
  rails.co: |
    # Built-in rails + MaaS as generation engine
---
apiVersion: v1
kind: Secret
metadata:
  name: nemo-maas-token
  namespace: llm
type: Opaque
stringData:
  token: REPLACE_ME
---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: workshop
  namespace: llm
  annotations:
    security.opendatahub.io/enable-auth: "true"
spec:
  nemoConfigs:
    - name: maas
      configMaps:
        - nemo-workshop-maas
      default: true
  env:
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: nemo-maas-token
          key: token
